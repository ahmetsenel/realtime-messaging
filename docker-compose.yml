services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: postgres
      TZ: Europe/Istanbul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messaging-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - messaging-network

  eureka-server:
    image: ahmetsnl/realtime-messaging-eureka-server:latest
    build:
      context: ./backend/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - messaging-network

  api-gateway:
    image: ahmetsnl/realtime-messaging-api-gateway:latest
    build:
      context: ./backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - messaging-network

  auth-service:
    image: ahmetsnl/realtime-messaging-auth-service:latest
    build:
      context: ./backend/auth-service
    container_name: auth-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Europe/Istanbul
    depends_on:
      - eureka-server
      - postgres
      - redis
    networks:
      - messaging-network

  chat-service:
    image: ahmetsnl/realtime-messaging-chat-service:latest
    build:
      context: ./backend/chat-service
    container_name: chat-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      TZ: Europe/Istanbul
    depends_on:
      - eureka-server
      - postgres
    networks:
      - messaging-network

  frontend:
    image: ahmetsnl/realtime-messaging-frontend:latest
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - messaging-network

volumes:
  postgres_data:

networks:
  messaging-network:
    driver: bridge